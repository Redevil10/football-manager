[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    -m "not e2e"
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    e2e: Browser tests; needs playwright and starts a real server.
        Excluded from the default run -- use `pytest -m e2e` to run them.
