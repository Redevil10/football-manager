name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Must match the ruff-pre-commit rev in prek.toml. Unpinned, `uvx ruff` takes
  # whatever is newest, so a ruff release that changes the default rule set
  # turns CI red without a single line of this repo changing -- 0.16 did exactly
  # that, reporting 359 findings against an untouched main. Bump both together.
  RUFF_VERSION: "0.15.4"

jobs:
  lint-and-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Check lockfile is up to date
        run: uv lock --check

      - name: Run ruff lint
        run: uvx ruff@${{ env.RUFF_VERSION }} check --extend-select=I

      - name: Run ruff format
        run: uvx ruff@${{ env.RUFF_VERSION }} format --check --diff
