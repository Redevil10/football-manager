name: Deploy to HF Space

# Manual only — never runs on push/PR.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    # workflow_dispatch takes no `branches:` filter -- the ref is chosen when the
    # run is started, so it has to be checked here instead. Without this, a
    # dispatch from a feature branch would ship that branch to the Space.
    #
    # Defence in depth on the actor too: workflow_dispatch already requires write
    # access, but this also blocks any collaborator added later.
    if: github.actor == 'Redevil10' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Deploy to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        # --no-project: skip syncing the app's deps; the script only needs hub.
        run: uv run --no-project --with huggingface_hub --python 3.13 python deploy_hf.py
