[project]
name = "football-manager"
version = "0.1.0"
description = "Football Team Assignment App"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-fasthtml>=0.14.11",  # Security: Fix Dependabot alert (starlette CVEs)
    "uvicorn>=0.38.0",
    "fasthtml-hf",
    "huggingface-hub",  # direct dep for deploy_hf.py (also pulled in by fasthtml-hf)
    "bcrypt>=4.0.0",
    "filelock>=3.20.3",  # Security: Fix Dependabot alert
    "google-genai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-randomly>=3.0.0",
    "pytest-asyncio>=0.23.0",
    # Pinned exactly, and the single place the version lives: CI and the
    # pre-commit hook both run it through `uv run ruff`. An unpinned `uvx ruff`
    # takes whatever is newest, so a release that changes the default rule set
    # turns CI red with no change to this repo -- 0.16 did exactly that.
    "ruff==0.15.4",
]
# Browser tests (tests/e2e). Kept separate because they also need a browser
# binary: `playwright install chromium`. They are excluded from the default
# pytest run and skipped entirely when playwright is not installed.
e2e = [
    "playwright>=1.40.0",
]

[tool.coverage.run]
# deploy_hf.py is an ops/deploy script (only orchestrates huggingface_hub
# API calls); it never runs in the app and isn't meaningfully unit-testable.
#
# The test suite itself is measured by nothing meaningful: a test file that runs
# is ~100% "covered" and one that does not is 0%, which says something about
# which tests ran, not about how well the app is tested. Counting them also
# inflated the headline number, and made the e2e suite -- deliberately
# deselected in the unit job -- look like 260 lines of dead code.
omit = [
    "deploy_hf.py",
    "tests/*",
]

[tool.ruff.lint]
# Ignore F403 and F405 for star imports from fasthtml.common
# FastHTML is designed to work with star imports (from fasthtml.common import *)
# F403: star import used; unable to detect undefined names
# F405: may be undefined, or defined from star imports
# All HTML components like P, Div, H2, etc. are exported from fasthtml.common
ignore = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["core", "db", "logic", "render", "routes"]
